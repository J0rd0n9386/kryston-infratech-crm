services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kryston-crm
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SEED_DEMO=false
      - APP_TIMEZONE=Asia/Kolkata
    env_file:
      - .env
    volumes:
      - crm_data:/app/data
      - crm_backups:/app/backups

volumes:
  crm_data:
  crm_backups:
