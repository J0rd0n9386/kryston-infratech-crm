name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Node ${{ matrix.node-version }} - TZ ${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        tz: ['UTC', 'Asia/Kolkata']
    env:
      TZ: ${{ matrix.tz }}
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long-unique
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (production dependencies)
        run: npm audit --omit=dev

      - name: Syntax Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test
